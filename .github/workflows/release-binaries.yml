# Builds standalone Tomofast-x binaries (OpenMP, no MPI) for macOS Apple Silicon,
# macOS Intel and Windows x64, tests them, and attaches them to the GitHub Release
# when a version tag (v*) is pushed. It can also be run by hand from the Actions tab,
# in which case the zips are kept as workflow artifacts only.

name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    defaults:
      run:
        # Login shell, so the conda environment is active.
        shell: bash -el {0}
    env:
      # Oldest macOS the binaries support (Big Sur, the first with Apple Silicon).
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5

      - name: Set version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install gfortran (conda-forge)
        # conda-forge's compiler runtime targets old macOS versions, unlike Homebrew's,
        # whose libraries only run on the macOS version of the build machine.
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: build
          create-args: gfortran make
          init-shell: bash

      - name: Build (OpenMP, no MPI)
        run: |
          [ "$(uname -m)" = "${{ matrix.arch }}" ] || { echo "Runner is $(uname -m), expected ${{ matrix.arch }}"; exit 1; }
          gfortran --version
          make USE_MPI=0
          file tomofastx

      - name: Assemble bundle
        run: |
          BUNDLE="tomofastx-${VERSION}-macos-${{ matrix.arch }}"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          mkdir -p "$BUNDLE/parfiles" "$BUNDLE/data/gravmag"
          cp tomofastx "$BUNDLE/"
          cp parfiles/Parfile_mansf_slice.txt "$BUNDLE/parfiles/"
          cp -R data/gravmag/mansf_slice "$BUNDLE/data/gravmag/"
          cp LICENSE .github/release/README.txt "$BUNDLE/"
          bash .github/scripts/bundle_macos_libs.sh "$BUNDLE" tomofastx "$CONDA_PREFIX/lib"
          echo "Minimum macOS version of the bundled files:"
          bad=0
          for f in "$BUNDLE/tomofastx" "$BUNDLE"/lib/*.dylib; do
            minos=$(vtool -show-build "$f" 2>/dev/null | awk '/minos/{print $2}' | head -n 1)
            echo "  $(basename "$f"): $minos"
            # Fail if any file needs a newer macOS than the deployment target.
            if [ "$(printf '%s\n' "$minos" "$MACOSX_DEPLOYMENT_TARGET" | sort -V | tail -n 1)" != "$MACOSX_DEPLOYMENT_TARGET" ]; then bad=1; fi
          done
          [ "$bad" -eq 0 ] || { echo "Some files need a newer macOS than $MACOSX_DEPLOYMENT_TARGET."; exit 1; }

      - name: Hide the compiler
        # Proves the bundle does not depend on the conda environment or Homebrew's gcc.
        run: |
          mv "$CONDA_PREFIX" "$RUNNER_TEMP/hidden-conda-env"
          for d in /opt/homebrew/opt/gcc /usr/local/opt/gcc; do
            [ -e "$d" ] && sudo mv "$(cd "$d" && pwd -P)" "$RUNNER_TEMP/hidden-brew-gcc-$(basename "$(dirname "$d")")" || true
          done

      - name: Test the bundle
        # A plain (non-login) shell, since the conda environment has been moved away.
        shell: bash
        run: bash .github/scripts/run_checks.sh "$BUNDLE" tomofastx

      - name: Zip
        shell: bash
        run: ditto -c -k --keepParent "$BUNDLE" "$BUNDLE.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-libgomp

      - name: Set version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build (OpenMP, no MPI, static runtime)
        run: |
          gfortran --version
          make WINDOWS=1 COMPILER=1 USE_MPI=0

      - name: Check the exe needs only Windows system DLLs
        run: |
          objdump -p tomofastx.exe | grep "DLL Name" | tee dlls.txt
          # gfortran, OpenMP, quadmath, gcc and winpthread DLLs all start with "lib".
          if grep -qi "DLL Name: lib" dlls.txt; then
            echo "The exe depends on compiler runtime DLLs; it must be statically linked."
            exit 1
          fi

      - name: Assemble bundle
        run: |
          BUNDLE="tomofastx-${VERSION}-windows-x64"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          mkdir -p "$BUNDLE/parfiles" "$BUNDLE/data/gravmag"
          cp tomofastx.exe "$BUNDLE/"
          cp parfiles/Parfile_mansf_slice.txt "$BUNDLE/parfiles/"
          cp -R data/gravmag/mansf_slice "$BUNDLE/data/gravmag/"
          cp LICENSE .github/release/README.txt "$BUNDLE/"
          # Windows line endings, so the text files open cleanly in Notepad.
          sed -i 's/$/\r/' "$BUNDLE/README.txt" "$BUNDLE/LICENSE"

      - name: Test the bundle
        run: bash .github/scripts/run_checks.sh "$BUNDLE" tomofastx.exe

      - name: Run the example outside MSYS2
        # Plain PowerShell, without the MSYS2 folders on PATH, as a user would run it.
        shell: pwsh
        run: |
          $env:OMP_NUM_THREADS = 2
          $work = Join-Path $env:RUNNER_TEMP "pwsh-check"
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item -Recurse "$env:BUNDLE\*" $work
          Set-Location $work
          .\tomofastx.exe -p parfiles\Parfile_mansf_slice.txt | Tee-Object example.log
          if ($LASTEXITCODE -ne 0) { throw "tomofastx.exe exited with $LASTEXITCODE" }
          if (-not (Select-String -Quiet "THE END" example.log)) { throw "Example did not finish." }
          if (-not (Test-Path output\mansf_slice\Paraview\grav_final_model3D_full.vtk)) { throw "Final model missing." }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "$env:BUNDLE" -DestinationPath "$env:BUNDLE.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}.zip
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
